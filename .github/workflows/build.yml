name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; APK is signed with a throwaway debug key and will not be released."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pacer.p12"
          {
            echo "PACER_KEYSTORE_FILE=$RUNNER_TEMP/pacer.p12"
            echo "PACER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PACER_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk pacer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pacer-apk
          path: pacer.apk
          if-no-files-found: error

      - name: Publish to rolling "latest" release
        if: github.ref == 'refs/heads/main' && env.PACER_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest
          notes="Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. Download pacer.apk below on your phone to install."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$notes" --latest
          else
            gh release create latest --title "Pacer (latest)" --notes "$notes" --latest
          fi
          gh release upload latest pacer.apk --clobber
